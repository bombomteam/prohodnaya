# Стенд «Проходной»: frontend, Keycloak, backend, db, face и ollama (всё, кроме frontend и Keycloak, — профиль backend).
#
# Запуск из корня репозитория:
#   cp .env.example .env        # при необходимости поправить значения
#   docker compose up -d --build
#
# db и backend входят в профиль backend (COMPOSE_PROFILES=backend в .env.example).
# Чтобы поднять только frontend, уберите COMPOSE_PROFILES из .env.
#
# Все настройки — через .env (см. .env.example). Секреты в этот файл не пишутся.

name: prohodnaya

# Общие ограничения для всех сервисов: без root-привилегий, без записи в образ,
# с ротацией логов. Новые сервисы подключают их через `<<: *hardened`.
x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  frontend:
    <<: *hardened
    image: ${FRONTEND_IMAGE:-ghcr.io/bombomteam/prohodnaya-frontend}:${FRONTEND_TAG:-local}
    build:
      context: ./frontend
    user: "101:101"
    environment:
      # По умолчанию api: фронт ходит в бэкенд. Демо без сервера: FRONTEND_MODE=demo и пустой API_UPSTREAM= в .env.
      FRONTEND_MODE: ${FRONTEND_MODE:-api}
      API_BASE_URL: ${API_BASE_URL:-}
      # Без двоеточия в `-`: умолчание http://backend:8000 берётся, только если переменная не задана вовсе;
      # явно пустая API_UPSTREAM= (демо, либо внешний API_BASE_URL, как на стенде) остаётся пустой.
      API_UPSTREAM: ${API_UPSTREAM-http://backend:8000}
    # Единственная запись в контейнере — /tmp (config.js, pid и временные файлы nginx).
    tmpfs:
      - /tmp:size=16m,uid=101,gid=101,mode=0700,noexec,nosuid,nodev
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-80}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    pids_limit: 100
    mem_limit: 128m
    cpus: 0.5
    stop_grace_period: 10s
    networks:
      - edge

  keycloak:
    <<: *hardened
    # start-dev выполняет Quarkus augmentation в каталоге установки.
    read_only: false
    image: ${KEYCLOAK_IMAGE:-prohodnaya-keycloak}:${KEYCLOAK_TAG:-local}
    build:
      context: ./keycloak
    command: ["start-dev", "--import-realm"]
    user: "1000:0"
    environment:
      KC_DB: dev-file
      KC_HOSTNAME: ${KC_PUBLIC_URL:-http://localhost:8081}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS:-xforwarded}
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-}
      KC_ADMIN1_PASSWORD: ${KC_ADMIN1_PASSWORD:-}
      KC_MANAGER1_PASSWORD: ${KC_MANAGER1_PASSWORD:-}
      KC_CONTROLLER1_PASSWORD: ${KC_CONTROLLER1_PASSWORD:-}
      PANEL_REDIRECT_URI: ${PANEL_REDIRECT_URI:-http://localhost:8080/}
      PANEL_ORIGIN: ${PANEL_ORIGIN:-http://localhost:8080}
    volumes:
      - keycloak_data:/opt/keycloak/data
    tmpfs:
      - /tmp:size=64m,uid=1000,gid=0,mode=0700,nosuid,nodev
    ports:
      - "${KC_BIND:-127.0.0.1}:${KC_PORT:-8081}:8080"
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 300
    stop_grace_period: 30s
    networks:
      - edge

  db:
    # Без <<: *hardened: postgres пишет в свои каталоги и при старте меняет владельца файлов.
    image: postgres:16
    profiles: [backend]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edge

  backend:
    <<: *hardened
    profiles: [backend]
    build:
      context: ./backend
    env_file: .env
    # Помощник руководителя (backend/app/llm). Умолчания совпадают с backend/app/core/config.py;
    # переключить на внешний сервис: LLM_PROVIDER=external и LLM_EXTERNAL_* в .env. Зависимости от ollama
    # нет: пока модель скачивается, помощник сам отвечает «недоступен», остальная система работает.
    environment:
      # Таймаут запроса к модулю лиц, секунды; таймаут = отказ «Сервис распознавания недоступен».
      FACE_TIMEOUT_S: ${FACE_TIMEOUT_S:-10}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_EXTERNAL_URL: ${LLM_EXTERNAL_URL:-}
      LLM_EXTERNAL_MODEL: ${LLM_EXTERNAL_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-60}
    depends_on:
      db:
        condition: service_healthy
    # Пишет только в /data (фото эталонов, план) и /tmp.
    volumes:
      - data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - edge
      - face-internal
      - llm

  # Модуль распознавания лиц (face/, контракт face/docs/api.md). Без ports: — доступен только бэкенду
  # по http://face:8000 во внутренней сети face-internal без выхода наружу. Веса внутри образа.
  # Камера (MediaMTX) подключается позже: см. face/docs/compose-snippet.md; пока FACE_CAMERAS пуст —
  # работает режим verify/frames (кадры с фронта).
  face:
    <<: *hardened
    profiles: [backend]
    image: ${FACE_IMAGE:-prohodnaya-face}:${FACE_TAG:-local}
    build:
      context: ./face
    user: "10001:10001"
    environment:
      FACE_CAMERAS: ${FACE_CAMERAS:-}
      FACE_ANALYZE_FPS: ${FACE_ANALYZE_FPS:-4}
      # auto: видеокарта, если проброшена (стенд: deploy/compose.stand.yaml), иначе CPU.
      FACE_DEVICE: ${FACE_DEVICE:-auto}
      FACE_GPU_MEM_MB: ${FACE_GPU_MEM_MB:-2048}
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD:-}
      FACE_LIVENESS_THRESHOLD: ${FACE_LIVENESS_THRESHOLD:-}
      FACE_CONSOLE: ${FACE_CONSOLE:-0}
      FACE_THREADS: ${FACE_THREADS:-4}
      ORT_DISABLE_TELEMETRY: "1"
    # Единственная запись — /tmp (временный файл видео в консоли).
    tmpfs:
      - /tmp:size=256m,uid=10001,gid=10001,mode=0700,noexec,nosuid,nodev
    healthcheck:
      test: ["CMD", "python", "-c", "import json,sys,urllib.request as u; r=u.urlopen('http://127.0.0.1:8000/v1/health', timeout=4); sys.exit(0 if json.load(r).get('models_loaded') else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 3
    cpus: 4.0
    mem_limit: 3g
    pids_limit: 200
    stop_grace_period: 10s
    networks:
      - face-internal

  # Медиасервер камеры (MediaMTX): айфон/IP-камера публикует RTMP на 1935, модуль face читает RTSP
  # во внутренней сети. Профиль camera: на сервере включается в COMPOSE_PROFILES. Конфиг — файл модуля
  # face/tools/camera/mediamtx.compose.yml, пароли — переменными MediaMTX поверх пустых полей pass.
  # Пустой пароль не даёт открытую публикацию: значение по умолчанию заведомо неверное, и MediaMTX
  # не стартует с ошибкой про MTX_AUTHINTERNALUSERS_<n>_PASS — задайте CAMERA_*_PASS в .env.
  camera-relay:
    <<: *hardened
    profiles: [camera]
    image: bluenviron/mediamtx:1.21.2@sha256:c7540465f868a02652118bea5a0daab12a29ac0f6cb8485abd535939ecddf886
    user: "10002:10002"
    volumes:
      - ./face/tools/camera/mediamtx.compose.yml:/mediamtx.yml:ro
    environment:
      MTX_AUTHINTERNALUSERS_0_PASS: ${CAMERA_PUBLISH_PASS:-sha256:не-задан-CAMERA_PUBLISH_PASS}
      MTX_AUTHINTERNALUSERS_1_PASS: ${CAMERA_READ_PASS:-sha256:не-задан-CAMERA_READ_PASS}
      # Чтение и API — только из внутренней сети face-internal (подсеть ниже, в networks).
      MTX_AUTHINTERNALUSERS_1_IPS: ${FACE_NET_SUBNET:-172.30.43.0/24}
    tmpfs:
      - /tmp:size=16m,uid=10002,gid=10002,mode=0700,noexec,nosuid,nodev
    ports:
      # Только приём потока со стримера. RTSP 8554 и API 9997 наружу не публикуются.
      - "${CAMERA_RTMP_BIND:-0.0.0.0}:${CAMERA_RTMP_PORT:-1935}:1935"
    # В образе нет оболочки и wget/curl — healthcheck не задать; поток виден в GET /v1/health модуля face.
    cpus: 1.0
    mem_limit: 256m
    pids_limit: 100
    stop_grace_period: 5s
    networks:
      edge: {}         # для опубликованного порта 1935
      face-internal:   # RTSP для модуля face
        # Имя, которое резолвится только во внутренней сети: face-console в двух сетях, и по имени
        # camera-relay мог прийти через edge — тогда reader отклоняется (доступ только из face-internal).
        aliases: [camera-relay-internal]

  # Тестовая консоль модуля лиц для команды: живой просмотр камеры (люди и лица) и проверка файлов.
  # Отдельный экземпляр (не тот, что проверяет проход), порт только на 127.0.0.1 — наружу через общий
  # Caddy (console.<IP>.sslip.io с basic auth). Камеру читает из camera-relay во внутренней сети.
  face-console:
    <<: *hardened
    profiles: [backend]
    image: ${FACE_IMAGE:-prohodnaya-face}:${FACE_TAG:-local}
    user: "10001:10001"
    environment:
      FACE_CONSOLE: "1"
      FACE_CAMERAS: ${FACE_CAMERAS:-}
      FACE_ANALYZE_FPS: ${FACE_CONSOLE_ANALYZE_FPS:-4}
      FACE_DEVICE: ${FACE_DEVICE:-auto}
      FACE_GPU_MEM_MB: ${FACE_GPU_MEM_MB:-2048}
      FACE_THREADS: ${FACE_THREADS:-4}
      ORT_DISABLE_TELEMETRY: "1"
    tmpfs:
      - /tmp:size=256m,uid=10001,gid=10001,mode=0700,noexec,nosuid,nodev
    ports:
      - "127.0.0.1:${FACE_CONSOLE_PORT:-8030}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,sys,urllib.request as u; r=u.urlopen('http://127.0.0.1:8000/v1/health', timeout=4); sys.exit(0 if json.load(r).get('models_loaded') else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 3
    cpus: 4.0
    mem_limit: 3g
    pids_limit: 200
    stop_grace_period: 10s
    networks:
      - edge           # для порта 127.0.0.1:8030 (сеть face-internal без выхода наружу порты не публикует)
      - face-internal  # RTSP camera-relay

  # Локальная модель для помощника руководителя (ollama, backend/app/llm). Без ports: — доступна только
  # бэкенду по http://ollama:11434 в сети llm (в неё входят только backend и ollama). Сеть llm не internal:
  # ollama один раз скачивает модель с registry.ollama.ai, поэтому ему нужен выход наружу.
  # Модель подтягивается в фоне при старте контейнера (повтор при сбое сети), веса лежат в томе ollama_data.
  # Healthcheck не зависит от скачивания: `ollama list` отвечает, как только поднялся сервер. Пока модель
  # не скачана, помощник отвечает «недоступен» — на деплой и проверку «жив ли» это не влияет.
  # GPU на стенде — deploy/compose.stand.yaml; без неё модель считается на CPU.
  ollama:
    <<: *hardened
    # Ollama пишет в свой каталог (ключи, манифесты) и во временные файлы — как keycloak, без read_only.
    read_only: false
    profiles: [backend]
    # Версия закреплена по тегу и digest (манифест-лист; проверено docker manifest inspect, образ не тянули).
    image: ollama/ollama:0.40.2@sha256:b86366bb528bbf7f1424435d165028497a5b69bf6ddb4fa5a87102e2b79f44fb
    # В скрипте $$ — это $ для оболочки контейнера (иначе compose подставил бы значение при разборе файла).
    entrypoint:
      - /bin/sh
      - -c
      - |
        (
          sleep 3
          i=0
          until ollama pull "$${OLLAMA_MODEL}"; do
            i=$$((i + 1))
            [ "$$i" -ge 40 ] && break
            sleep 15
          done
        ) &
        exec ollama serve
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      # Держать модель в памяти между вопросами (по умолчанию 5 минут): на показе не ждать повторной загрузки.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      # Клиент ходит на loopback, а не на 0.0.0.0 из OLLAMA_HOST (адрес прослушивания сервера).
      test: ["CMD-SHELL", "OLLAMA_HOST=127.0.0.1:11434 ollama list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5
    cpus: 4.0
    mem_limit: 8g
    pids_limit: 1024
    stop_grace_period: 10s
    networks:
      - llm

volumes:
  keycloak_data: {}
  pgdata: {}
  data: {}
  ollama_data: {}

networks:
  edge: {}
  # Модуль лиц виден только бэкенду; у сети нет выхода наружу.
  face-internal:
    internal: true
    ipam:
      config:
        # На неё ссылается доступ reader в camera-relay (MTX_AUTHINTERNALUSERS_1_IPS).
        - subnet: ${FACE_NET_SUBNET:-172.30.43.0/24}
  # Бэкенд <-> ollama. Не internal: ollama скачивает модель из интернета. Порты в эту сеть не публикуются,
  # других сервисов в ней нет, поэтому снаружи и из остальных контейнеров ollama недоступен.
  llm: {}
