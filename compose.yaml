# Стенд «Проходной»: frontend, Keycloak, backend и db (db и backend — профиль backend).
#
# Запуск из корня репозитория:
#   cp .env.example .env        # при необходимости поправить значения
#   docker compose up -d --build
#
# db и backend входят в профиль backend (COMPOSE_PROFILES=backend в .env.example).
# Чтобы поднять только frontend, уберите COMPOSE_PROFILES из .env.
#
# Все настройки — через .env (см. .env.example). Секреты в этот файл не пишутся.

name: prohodnaya

# Общие ограничения для всех сервисов: без root-привилегий, без записи в образ,
# с ротацией логов. Новые сервисы подключают их через `<<: *hardened`.
x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  frontend:
    <<: *hardened
    image: ${FRONTEND_IMAGE:-ghcr.io/bombomteam/prohodnaya-frontend}:${FRONTEND_TAG:-local}
    build:
      context: ./frontend
    user: "101:101"
    environment:
      FRONTEND_MODE: ${FRONTEND_MODE:-demo}
      API_BASE_URL: ${API_BASE_URL:-}
      API_UPSTREAM: ${API_UPSTREAM:-}
    # Единственная запись в контейнере — /tmp (config.js, pid и временные файлы nginx).
    tmpfs:
      - /tmp:size=16m,uid=101,gid=101,mode=0700,noexec,nosuid,nodev
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-80}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    pids_limit: 100
    mem_limit: 128m
    cpus: 0.5
    stop_grace_period: 10s
    networks:
      - edge

  keycloak:
    <<: *hardened
    # start-dev выполняет Quarkus augmentation в каталоге установки.
    read_only: false
    image: ${KEYCLOAK_IMAGE:-prohodnaya-keycloak}:${KEYCLOAK_TAG:-local}
    build:
      context: ./keycloak
    command: ["start-dev", "--import-realm"]
    user: "1000:0"
    environment:
      KC_DB: dev-file
      KC_HOSTNAME: ${KC_PUBLIC_URL:-http://localhost:8081}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS:-xforwarded}
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-}
      KC_ADMIN1_PASSWORD: ${KC_ADMIN1_PASSWORD:-}
      KC_MANAGER1_PASSWORD: ${KC_MANAGER1_PASSWORD:-}
      KC_CONTROLLER1_PASSWORD: ${KC_CONTROLLER1_PASSWORD:-}
      PANEL_REDIRECT_URI: ${PANEL_REDIRECT_URI:-http://localhost:8080/}
      PANEL_ORIGIN: ${PANEL_ORIGIN:-http://localhost:8080}
    volumes:
      - keycloak_data:/opt/keycloak/data
    tmpfs:
      - /tmp:size=64m,uid=1000,gid=0,mode=0700,nosuid,nodev
    ports:
      - "${KC_BIND:-127.0.0.1}:${KC_PORT:-8081}:8080"
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 300
    stop_grace_period: 30s
    networks:
      - edge

  db:
    # Без <<: *hardened: postgres пишет в свои каталоги и при старте меняет владельца файлов.
    image: postgres:16
    profiles: [backend]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edge

  backend:
    <<: *hardened
    profiles: [backend]
    build:
      context: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # Пишет только в /data (фото эталонов, план) и /tmp.
    volumes:
      - data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - edge
      - face-internal

  # Модуль распознавания лиц (face/, контракт face/docs/api.md). Без ports: — доступен только бэкенду
  # по http://face:8000 во внутренней сети face-internal без выхода наружу. Веса внутри образа.
  # Камера (MediaMTX) подключается позже: см. face/docs/compose-snippet.md; пока FACE_CAMERAS пуст —
  # работает режим verify/frames (кадры с фронта).
  face:
    <<: *hardened
    profiles: [backend]
    image: ${FACE_IMAGE:-prohodnaya-face}:${FACE_TAG:-local}
    build:
      context: ./face
    user: "10001:10001"
    environment:
      FACE_CAMERAS: ${FACE_CAMERAS:-}
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD:-}
      FACE_LIVENESS_THRESHOLD: ${FACE_LIVENESS_THRESHOLD:-}
      FACE_CONSOLE: ${FACE_CONSOLE:-0}
      FACE_THREADS: ${FACE_THREADS:-4}
      ORT_DISABLE_TELEMETRY: "1"
    # Единственная запись — /tmp (временный файл видео в консоли).
    tmpfs:
      - /tmp:size=256m,uid=10001,gid=10001,mode=0700,noexec,nosuid,nodev
    healthcheck:
      test: ["CMD", "python", "-c", "import json,sys,urllib.request as u; r=u.urlopen('http://127.0.0.1:8000/v1/health', timeout=4); sys.exit(0 if json.load(r).get('models_loaded') else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 3
    cpus: 4.0
    mem_limit: 3g
    pids_limit: 200
    stop_grace_period: 10s
    networks:
      - face-internal

  # Медиасервер камеры (MediaMTX): айфон/IP-камера публикует RTMP на 1935, модуль face читает RTSP
  # во внутренней сети. Профиль camera: на сервере включается в COMPOSE_PROFILES. Конфиг — файл модуля
  # face/tools/camera/mediamtx.compose.yml, пароли — переменными MediaMTX поверх пустых полей pass.
  # Пустой пароль не даёт открытую публикацию: значение по умолчанию заведомо неверное, и MediaMTX
  # не стартует с ошибкой про MTX_AUTHINTERNALUSERS_<n>_PASS — задайте CAMERA_*_PASS в .env.
  camera-relay:
    <<: *hardened
    profiles: [camera]
    image: bluenviron/mediamtx:1.21.2@sha256:c7540465f868a02652118bea5a0daab12a29ac0f6cb8485abd535939ecddf886
    user: "10002:10002"
    volumes:
      - ./face/tools/camera/mediamtx.compose.yml:/mediamtx.yml:ro
    environment:
      MTX_AUTHINTERNALUSERS_0_PASS: ${CAMERA_PUBLISH_PASS:-sha256:не-задан-CAMERA_PUBLISH_PASS}
      MTX_AUTHINTERNALUSERS_1_PASS: ${CAMERA_READ_PASS:-sha256:не-задан-CAMERA_READ_PASS}
      # Чтение и API — только из внутренней сети face-internal (подсеть ниже, в networks).
      MTX_AUTHINTERNALUSERS_1_IPS: ${FACE_NET_SUBNET:-172.30.43.0/24}
    tmpfs:
      - /tmp:size=16m,uid=10002,gid=10002,mode=0700,noexec,nosuid,nodev
    ports:
      # Только приём потока со стримера. RTSP 8554 и API 9997 наружу не публикуются.
      - "${CAMERA_RTMP_BIND:-0.0.0.0}:${CAMERA_RTMP_PORT:-1935}:1935"
    # В образе нет оболочки и wget/curl — healthcheck не задать; поток виден в GET /v1/health модуля face.
    cpus: 1.0
    mem_limit: 256m
    pids_limit: 100
    stop_grace_period: 5s
    networks:
      - edge           # для опубликованного порта 1935
      - face-internal  # RTSP для модуля face

  # Сюда добавится ollama (его ведёт другой участник).

volumes:
  keycloak_data: {}
  pgdata: {}
  data: {}

networks:
  edge: {}
  # Модуль лиц виден только бэкенду; у сети нет выхода наружу.
  face-internal:
    internal: true
    ipam:
      config:
        # На неё ссылается доступ reader в camera-relay (MTX_AUTHINTERNALUSERS_1_IPS).
        - subnet: ${FACE_NET_SUBNET:-172.30.43.0/24}
