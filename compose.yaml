# Стенд «Проходной»: frontend и Keycloak; backend и БД приложения добавляются отдельно.
#
# Запуск из корня репозитория:
#   cp .env.example .env        # при необходимости поправить значения
#   docker compose up -d --build
#
# db и backend входят в профиль backend (COMPOSE_PROFILES=backend в .env.example).
# Чтобы поднять только frontend, уберите COMPOSE_PROFILES из .env.
#
# Все настройки — через .env (см. .env.example). Секреты в этот файл не пишутся.

name: prohodnaya

# Общие ограничения для всех сервисов: без root-привилегий, без записи в образ,
# с ротацией логов. Новые сервисы подключают их через `<<: *hardened`.
x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  frontend:
    <<: *hardened
    image: ${FRONTEND_IMAGE:-ghcr.io/bombomteam/prohodnaya-frontend}:${FRONTEND_TAG:-local}
    build:
      context: ./frontend
    user: "101:101"
    environment:
      FRONTEND_MODE: ${FRONTEND_MODE:-demo}
      API_BASE_URL: ${API_BASE_URL:-}
      API_UPSTREAM: ${API_UPSTREAM:-}
    # Единственная запись в контейнере — /tmp (config.js, pid и временные файлы nginx).
    tmpfs:
      - /tmp:size=16m,uid=101,gid=101,mode=0700,noexec,nosuid,nodev
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-80}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    pids_limit: 100
    mem_limit: 128m
    cpus: 0.5
    stop_grace_period: 10s
    networks:
      - edge

  keycloak:
    <<: *hardened
    # start-dev выполняет Quarkus augmentation в каталоге установки.
    read_only: false
    image: ${KEYCLOAK_IMAGE:-prohodnaya-keycloak}:${KEYCLOAK_TAG:-local}
    build:
      context: ./keycloak
    command: ["start-dev", "--import-realm"]
    user: "1000:0"
    environment:
      KC_DB: dev-file
      KC_HOSTNAME: ${KC_PUBLIC_URL:-http://localhost:8081}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS:-}
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Set bootstrap admin password in .env}
      KC_ADMIN1_PASSWORD: ${KC_ADMIN1_PASSWORD:?Set admin1 password in .env}
      KC_MANAGER1_PASSWORD: ${KC_MANAGER1_PASSWORD:?Set manager1 password in .env}
      KC_CONTROLLER1_PASSWORD: ${KC_CONTROLLER1_PASSWORD:?Set controller1 password in .env}
      PANEL_REDIRECT_URI: ${PANEL_REDIRECT_URI:-http://localhost:8080/}
      PANEL_ORIGIN: ${PANEL_ORIGIN:-http://localhost:8080}
    volumes:
      - keycloak_data:/opt/keycloak/data
    tmpfs:
      - /tmp:size=64m,uid=1000,gid=0,mode=0700,nosuid,nodev
    ports:
      - "${KC_BIND:-127.0.0.1}:${KC_PORT:-8081}:8080"
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 300
    stop_grace_period: 30s
    networks:
      - edge

volumes:
  keycloak_data: {}

networks:
  edge: {}
