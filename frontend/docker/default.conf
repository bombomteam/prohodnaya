server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Behind the TLS proxy the browser must never be sent to http://host:8080/...:
    # every redirect nginx issues (including the /dir -> /dir/ one) stays relative.
    absolute_redirect off;
    port_in_redirect off;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Generated by the entrypoint at startup (see docker/entrypoint.sh).
    location = /config.js {
        alias /tmp/config.js;
        default_type text/javascript;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    include /tmp/prohodnaya-api-location.conf;

    # Keep backend activation links compatible with the static application.
    location = /enroll {
        limit_except GET { deny all; }
        try_files /index.html =404;
    }
    # /enroll/ serves the app too, without a redirect. index.html loads ./styles.css
    # and ./src/app.js relative to the page, so those are mapped back to the root.
    location = /enroll/ {
        limit_except GET { deny all; }
        try_files /index.html =404;
    }
    location ~ ^/enroll/(styles\.css|config\.js|src/.+)$ {
        limit_except GET { deny all; }
        rewrite ^/enroll/(.+)$ /$1 last;
    }

    location / {
        limit_except GET { deny all; }
        try_files $uri $uri/ =404;
    }
}
