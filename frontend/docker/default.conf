server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /config.js {
        add_header Cache-Control "no-store" always;
    }

    include /tmp/prohodnaya-api-location.conf;

    location / {
        try_files $uri $uri/ =404;
    }
}
