server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Generated by the entrypoint at startup (see docker/entrypoint.sh).
    location = /config.js {
        alias /tmp/config.js;
        default_type text/javascript;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    include /tmp/prohodnaya-api-location.conf;

    location / {
        limit_except GET { deny all; }
        try_files $uri $uri/ =404;
    }
}
