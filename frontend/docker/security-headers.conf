# Included at server level and repeated in any location that sets its own add_header,
# because nginx drops inherited add_header directives in such locations.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Camera, geolocation and WebAuthn are used by the app itself; everything else is off.
add_header Permissions-Policy "camera=(self), geolocation=(self), publickey-credentials-get=(self), publickey-credentials-create=(self), microphone=(), payment=(), usb=()" always;
