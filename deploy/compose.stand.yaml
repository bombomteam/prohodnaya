# Надстройка compose только для сервера стенда: HTTPS-прокси и теги образов для пайплайна.
# Подключается обёрткой deploy/dc (см. docs/pipeline.md); локальной разработке не нужна.
# Правит только инфраструктура.

services:
  backend:
    # Пайплайн собирает образ с тегом = SHA коммита и хранит прошлые теги для отката.
    image: ${BACKEND_IMAGE:-prohodnaya-backend}:${BACKEND_TAG:-local}

  # Видеокарта сервера (NVIDIA A10) для модуля лиц: только на стенде. Образ face работает и без неё
  # (FACE_DEVICE=auto), поэтому локально у остальных ничего не меняется.
  face:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  face-console:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Локальная модель помощника: на видеокарте стенда (общая с face; qwen2.5:1.5b занимает порядка 1–2 ГБ).
  # Если видеокарта недоступна, ollama сам считает на CPU.
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  caddy:
    # HTTPS для всего стенда: сертификаты Let's Encrypt выпускаются и продлеваются сами.
    # Сеть хоста: Caddy ходит к сервисам через их порты на 127.0.0.1 и к странице
    # загрузки face (127.0.0.1:8765), которая запущена вне compose.
    image: caddy:2.11.7@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
    profiles: [proxy]
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      AUTH_DOMAIN: ${AUTH_DOMAIN:-auth.localhost}
      CAPTURE_DOMAIN: ${CAPTURE_DOMAIN:-capture.localhost}
      CONSOLE_DOMAIN: ${CONSOLE_DOMAIN:-console.localhost}
      CONSOLE_USER: ${CONSOLE_USER:-team}
      # Пусто — хеш случайного забытого пароля: консоль закрыта, а Caddy всё равно стартует.
      CONSOLE_PASS_HASH: ${CONSOLE_PASS_HASH:-JDJhJDE0JGNlYkJFdE5Lc0tMdnJGUE8ya3hkMHVEVDdDNklWcDdXM0tKajdkOE9MU21TRExPZ0U3eUZHCg==}
      CONSOLE_PORT: ${CONSOLE_PORT:-8030}
      FRONTEND_PORT: ${FRONTEND_PORT:-80}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      KC_PORT: ${KC_PORT:-8081}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8099/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    pids_limit: 200
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data: {}
  caddy_config: {}
