name: Build frontend container

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: frontend
      - name: Build image
        run: docker build -t ghcr.io/bombomteam/prohodnaya-frontend:latest ./frontend
      - name: Smoke test demo and API configuration
        run: |
          docker run -d --name prohodnaya-demo -p 127.0.0.1:18080:8080 ghcr.io/bombomteam/prohodnaya-frontend:latest
          curl --retry 10 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:18080/healthz
          curl -fsS http://127.0.0.1:18080/config.js | grep -F 'mode: "demo"'
          docker rm -f prohodnaya-demo
          docker run -d --name prohodnaya-api -p 127.0.0.1:18081:8080 -e FRONTEND_MODE=api -e API_BASE_URL=https://example.org/api ghcr.io/bombomteam/prohodnaya-frontend:latest
          curl --retry 10 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:18081/healthz
          curl -fsS http://127.0.0.1:18081/config.js | grep -F 'apiBaseUrl: "https://example.org/api"'
          docker rm -f prohodnaya-api
          docker network create prohodnaya-smoke
          docker run -d --name backend --network prohodnaya-smoke ghcr.io/bombomteam/prohodnaya-frontend:latest
          docker run -d --name prohodnaya-proxy --network prohodnaya-smoke -p 127.0.0.1:18082:8080 -e FRONTEND_MODE=api -e API_UPSTREAM=http://backend:8080 ghcr.io/bombomteam/prohodnaya-frontend:latest
          curl --retry 10 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:18082/healthz
          curl -fsS http://127.0.0.1:18082/config.js | grep -F 'apiBaseUrl: "/api"'
          docker rm -f prohodnaya-proxy backend
          docker network rm prohodnaya-smoke
      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Publish image
        run: |
          docker tag ghcr.io/bombomteam/prohodnaya-frontend:latest ghcr.io/bombomteam/prohodnaya-frontend:${{ github.sha }}
          docker push ghcr.io/bombomteam/prohodnaya-frontend:latest
          docker push ghcr.io/bombomteam/prohodnaya-frontend:${{ github.sha }}
